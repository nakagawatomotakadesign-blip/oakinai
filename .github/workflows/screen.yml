name: daily-screen
# schedule 起動時はどの cron が発火したかを run 名に残す（起動遅れの集計用: scripts/schedule_report.py）
run-name: daily-screen ${{ github.event.schedule }}

on:
  schedule:
    # 21:37 UTC = 翌朝 06:37 JST（毎時00/30分は混雑して起動が遅れやすいので少しずらす）
    - cron: "37 21 * * 0-4"
    # 以下2本は Polygon 無料枠が前営業日分を解放した後に最新セッションへ更新する回
    # （21:37 の回は解放前なので前営業日のデータで公開を維持する役割）
    # 前日の営業日を取る回なので火〜土（UTC）に走らせる。土曜の回で金曜のセッションを取る
    - cron: "17 6 * * 2-6"    # 15:17 JST 本命（Polygon 解放後、00分の混雑を避ける）
    - cron: "17 9 * * 2-6"    # 18:17 JST 保険（本命が起動しなかった日の取り直し）
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "初回のみ: 過去何営業日分の日足をキャッシュするか（RS計算に270推奨）"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 暴走時に分数を食い潰さないための保険（通常運転は3分）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run screen
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
        run: python scripts/screen.py
      - name: Commit results
        run: |
          git config user.name "screen-bot"
          git config user.email "screen-bot@users.noreply.github.com"
          git add docs/data cache
          git rm -r --cached --ignore-unmatch cache/daily.parquet > /dev/null 2>&1 || true
          # コミット名は実行日ではなく生成データの最新営業日（index.json の先頭）。読めなければ実行日
          ASOF=$(python -c 'import json; print(json.load(open("docs/data/index.json"))["dates"][0])' 2>/dev/null || date -u +%F)
          git diff --cached --quiet || git commit -m "screen: ${ASOF}"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
