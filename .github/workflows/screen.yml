name: daily-screen
# schedule 起動時はどの cron が発火したかを run 名に残す（起動遅れの集計用: scripts/schedule_report.py）
run-name: daily-screen ${{ github.event.schedule }}

# トリガーは2系統。どちらも Polygon 無料枠が前営業日分を解放した後（米東部の日付が変わる頃、
# 夏時間で 04:00 UTC 前後）に走らせ、前営業日のセッションを取得する。
#   メイン : cron-job.org から workflow_dispatch を火〜土 06:00 UTC（15:00 JST）に起動。
#            GitHub の schedule は起動が1〜5時間遅れるため外部スケジューラに任せている
#   保険   : 下の schedule（火〜土 09:17 UTC = 18:17 JST）。cron-job.org が止まった日の取り直し。
#            メインが取得済みなら何もせず終わる
on:
  schedule:
    # 前日の営業日を取る回なので火〜土（UTC）。土曜の回で金曜のセッションを取る
    - cron: "17 9 * * 2-6"
  # メインの起動経路（cron-job.org）。手動実行と初回 backfill もここから
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "初回のみ: 過去何営業日分の日足をキャッシュするか（RS計算に270推奨）"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 暴走時に分数を食い潰さないための保険（通常運転は3分）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run screen
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
        run: python scripts/screen.py
      - name: Commit results
        run: |
          git config user.name "screen-bot"
          git config user.email "screen-bot@users.noreply.github.com"
          git add docs/data cache
          git rm -r --cached --ignore-unmatch cache/daily.parquet > /dev/null 2>&1 || true
          # コミット名は実行日ではなく生成データの最新営業日（index.json の先頭）。読めなければ実行日
          ASOF=$(python -c 'import json; print(json.load(open("docs/data/index.json"))["dates"][0])' 2>/dev/null || date -u +%F)
          git diff --cached --quiet || git commit -m "screen: ${ASOF}"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
